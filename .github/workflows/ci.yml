name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      # The interpreter setup-uv provides is the runner's system Python, which is
      # externally managed: installing into it (`uv pip install --system`) is
      # refused, so everything goes into a uv-managed virtualenv instead.
      - run: uv venv
      - run: uv pip install ".[dev]"
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv venv
      # The tests mock every driver, but the dialect modules must still import,
      # so the full extras set is installed.
      - run: uv pip install ".[all,dev]"
      - run: uv run --no-sync pytest
